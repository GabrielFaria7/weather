<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdnjs.cloudflare.com https://unpkg.com 'sha256-hwrgPuOfMzqEAdG5FKGmtShS3BKiDOfGF/0oEkFzbVk=';
                 style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data: https://*.tile.openstreetmap.org https://gibs.earthdata.nasa.gov https://view.eumetsat.int https://unpkg.com https://s3.amazonaws.com/elevation-tiles-prod/;
                 connect-src https://geocoding-api.open-meteo.com https://api.open-meteo.com https://air-quality-api.open-meteo.com https://marine-api.open-meteo.com https://apiprevmet3.inmet.gov.br https://gibs.earthdata.nasa.gov https://view.eumetsat.int;
                 object-src 'none';
                 base-uri 'self';
                 form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Weather</title>
  <meta name="description" content="Previsão do tempo para qualquer cidade do mundo: agora, por hora, 10 dias, nuvens de satélite, vento animado e qualidade do ar. Dados da Open-Meteo.">
  <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="canonical" href="https://gabrielfaria7.github.io/weather/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Weather">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Weather · previsão do tempo">
  <meta property="og:description" content="Previsão do tempo para qualquer cidade do mundo: agora, por hora, 10 dias, nuvens de satélite, vento animado e qualidade do ar. Dados da Open-Meteo.">
  <meta property="og:url" content="https://gabrielfaria7.github.io/weather/">
  <meta property="og:image" content="https://gabrielfaria7.github.io/weather/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo do Weather com o texto: previsão do tempo para qualquer cidade do mundo, direto no navegador.">
  <meta name="twitter:card" content="summary_large_image">

  <script>
    (function () {
      var tema = null;
      try { tema = localStorage.getItem("weather.tema"); } catch (e) {}
      if (tema !== "claro" && tema !== "escuro") {
        tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
      }
      document.documentElement.dataset.theme = tema === "escuro" ? "dark" : "light";
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <div class="topo-linha container">
      <a class="logo" href="./" aria-label="Weather, página inicial">
        <svg class="logo-marca" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4A9EFF"/><stop offset="1" stop-color="#1769E0"/>
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="11" fill="url(#logo-grad)"/>
          <circle cx="15" cy="15" r="6" fill="#FFB020"/>
          <path d="M14 30a6 6 0 0 1 .6-12 8 8 0 0 1 15 2.2A5 5 0 0 1 29 30z" fill="#fff"/>
        </svg>
        <span class="logo-texto">Weather</span>
      </a>

      <form class="busca" id="form-busca" role="search" autocomplete="off">
        <span class="busca-icone" data-icone="busca" aria-hidden="true"></span>
        <input id="campo-busca" type="search" placeholder="Buscar cidade" aria-label="Buscar cidade"
               role="combobox" aria-expanded="false" aria-controls="sugestoes" aria-autocomplete="list">
        <ul id="sugestoes" class="sugestoes" role="listbox" aria-label="Sugestões de cidades" hidden></ul>
      </form>

      <div class="acoes">
        <button id="btn-localizacao" class="btn-icone" type="button" title="Usar minha localização" aria-label="Usar minha localização">
          <span data-icone="localizacao" aria-hidden="true"></span>
        </button>
        <div class="segmentado" role="group" aria-label="Unidade de temperatura">
          <button type="button" data-unidade="C" aria-pressed="true">°C</button>
          <button type="button" data-unidade="F" aria-pressed="false">°F</button>
        </div>
        <button id="btn-tema" class="btn-icone" type="button" aria-label="Alternar modo claro ou escuro" title="Modo claro/escuro">
          <span class="tema-sol" data-icone="sol" aria-hidden="true"></span>
          <span class="tema-lua" data-icone="lua" aria-hidden="true"></span>
        </button>
        <div class="config">
          <button id="btn-config" class="btn-icone" type="button" aria-haspopup="true" aria-expanded="false"
                  aria-controls="painel-config" aria-label="Configurações" title="Configurações">
            <span data-icone="config" aria-hidden="true"></span>
          </button>
          <div id="painel-config" class="dropdown" hidden>
            <p class="dropdown-titulo">Configurações</p>
            <fieldset class="opcao">
              <legend>Velocidade do vento</legend>
              <div class="segmentado segmentado-cheio" data-preferencia="vento">
                <button type="button" data-valor="kmh">km/h</button>
                <button type="button" data-valor="ms">m/s</button>
                <button type="button" data-valor="mph">mph</button>
              </div>
            </fieldset>
            <fieldset class="opcao">
              <legend>Formato de hora</legend>
              <div class="segmentado segmentado-cheio" data-preferencia="hora">
                <button type="button" data-valor="24">24 h</button>
                <button type="button" data-valor="12">12 h</button>
              </div>
            </fieldset>
            <fieldset class="opcao">
              <legend>Índice de qualidade do ar</legend>
              <div class="segmentado segmentado-cheio" data-preferencia="indiceAr">
                <button type="button" data-valor="iqar">Brasil (IQAr)</button>
                <button type="button" data-valor="eaqi">Europa (EAQI)</button>
              </div>
            </fieldset>
            <button type="button" class="btn-texto" id="btn-instalar" hidden>Instalar como aplicativo</button>
            <button type="button" class="btn-texto perigo" id="btn-limpar-favoritos">Limpar cidades favoritas</button>
          </div>
        </div>
      </div>
    </div>

    <nav class="abas" aria-label="Seções da previsão">
      <div class="container abas-trilho">
        <a class="aba" href="#hoje">Hoje</a>
        <a class="aba" href="#por-hora">Por hora</a>
        <a class="aba" href="#dias">10 dias</a>
        <a class="aba" href="#mapa">Mapas</a>
        <a class="aba" href="#indicadores">Informações climáticas</a>
      </div>
    </nav>
  </header>

  <main id="conteudo" class="container" tabindex="-1" aria-live="polite"></main>

  <footer class="rodape container">
    <p>Dados meteorológicos: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
       Mapa: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></p>
    <p>© 2026 Gabriel Faria · Todos os direitos reservados</p>
  </footer>

  <dialog id="modal-dia" class="modal" aria-labelledby="modal-titulo"></dialog>
  <div id="aviso-flutuante" class="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.6.1/chart.umd.min.js"
          integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.9.2/dist/leaflet-velocity.min.js"
          integrity="sha384-LtMJygfR9jrlPTx7rf4xhs89fU1QqQ9cMCQn7x6uQ7d4rWtV0WTme0Hw9Y5iK504" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
