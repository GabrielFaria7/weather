<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; font-family: Inter, sans-serif; color: #E6EDF7; overflow: hidden;

  h1 { font-size: 104px; font-weight: 800; letter-spacing: -3px; }
  p { margin-top: 40px; font-size: 40px; font-weight: 500; color: #B3C1DE; line-height: 1.3; max-width: 900px; }
  ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 48px; flex-wrap: nowrap; }
  li { padding: 10px 18px; border-radius: 999px; font-size: 23px; font-weight: 600; color: #E6EDF7;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); }
  .rodape { position: absolute; left: 88px; bottom: 44px; font-size: 24px; font-weight: 500; color: #7F8FB0; }
</style></head><body>
  <div class="conteudo">

        <rect width="40" height="40" rx="11" fill="url(#g)"/><circle cx="15" cy="15" r="6" fill="#FFB020"/>

    </div>

  </div>
